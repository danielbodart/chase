# The toolchain and the tasks CI and people call. Go is pinned to the patch:
# a release's binaries are built by CI with this Go (scripts/build.sh), and
# the flake's package is that release binary, not a build of its own
# (flake.nix). Its major.minor is the one nixpkgs' go_1_27 has on
# nixos-26.05, which flake.nix's dev shell offers to anyone without mise.
# The weekly update moves each tool's patch; a new minor moves by hand.

[tools]
go = "1.27.3"
shellcheck = "0.11.0"
# sqlite3, for the codex tests that repoint a thread index.
sqlite = "3.54.1"
# protoc, for the gcloud generator's tests, which compile its fixtures: the
# major.minor nixpkgs' protobuf has on nixos-26.05, as the dev shell's.
protoc = "34.1"

[env]
# Static, as every release is (scripts/build.sh).
CGO_ENABLED = "0"
# What a release tag gives those who pin it: the binaries, which the
# flake's package installs, so the Go code they are built from (cmd,
# internal, and apps/, the generated tables the tests regenerate and the
# apps' tests read) and how they are built and stamped (scripts/build.sh,
# VERSION; the version is `chase-generate version`, under cmd); and the
# flake and its module (flake.nix, module.nix and the Nix files it imports:
# apps/, lib/, selector.nix, grant.nix, record.nix). A change to any of
# these since the last release is released, as is a move of the Go pin
# above, which builds the binaries (scripts/release-due.sh); flake.lock (a
# consumer follows its own nixpkgs), the rest of mise.toml, the tests, docs
# and workflows are not, nor is nix/release.json, which a release adds on
# its tag's own commit.
RELEASE_PATHS = "cmd internal apps lib go.mod go.sum flake.nix module.nix selector.nix grant.nix record.nix VERSION scripts/build.sh"

[tasks.check]
description = "Lint, unit tests, shellcheck and the release scripts' tests: the dev loop and CI's fast job"
depends = ["lint", "test", "shellcheck", "scripts-test"]

# lint and shellcheck are skipped while their sources stand still; test is
# not, since Go's own test cache knows better than a glob what a test read.
[tasks.lint]
description = "gofmt and go vet"
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = { auto = true }
run = [
  'test -z "$(gofmt -l .)" || { gofmt -l . >&2; echo "not gofmt-ed" >&2; exit 1; }',
  "go vet ./...",
]

# The tests that hold what chase writes to `frisket check` skip without a
# frisket on PATH, unless CHASE_REQUIRE_FRISKET is set, as CI's check and
# race jobs set it, with scripts/frisket.sh's on PATH.
[tasks.test]
description = "go test, every package"
run = "go test ./..."

# The race detector's runtime is C, so this is the one task that turns cgo
# on, for itself, and needs a C compiler (CI's race job has gcc; locally,
# `nix shell nixpkgs#gcc -c mise run race`). Nothing it builds ships: every
# release stays static.
[tasks.race]
description = "go test -race, every package (needs cgo and a C compiler: CI's race job)"
run = "CGO_ENABLED=1 go test -race ./..."

[tasks.shellcheck]
description = "shellcheck the scripts"
sources = ["scripts/*.sh"]
outputs = { auto = true }
run = "shellcheck scripts/*.sh"

[tasks.scripts-test]
description = "The release scripts' own tests, against a throwaway repository and a known SHA256SUMS"
run = ["scripts/release-due-test.sh", "scripts/release-json-test.sh"]

# The binaries a release carries, built as CI's build job builds them.
[tasks.build]
description = "The static chase binary for linux on amd64 and arm64, in dist/"
run = "scripts/build.sh"

# The last release is its tag's parent (scripts/last-release.sh), since a
# release's tag is a child commit holding nix/release.json.
[tasks.release-due]
description = "Exit 0, printing true, if anything a release is built from (RELEASE_PATHS, Go's pin) changed since the last release; else print false and exit 1"
run = "scripts/release-due.sh"
