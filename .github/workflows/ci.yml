name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

jobs:
  # What `nix flake check` checks, split across runners. On one runner the two
  # VM tests, the tests under the race detector and the plain tests shared its
  # four CPUs and took the check to nine minutes; each is minutes on its own,
  # so each is a job of its own, and `rest` is everything else. `rest` builds
  # every check the others do not name, so a check added to the flake is built
  # without being added here.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [docker-session, gcloud-session, race, test, rest]
    steps:
      - uses: actions/checkout@v7

      # install-nix-action gives the runner's /dev/kvm to the build user, so
      # the VM tests run under KVM rather than emulated.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      # The danielbodart cache, shared with flong and frisket: each job pulls
      # what another job or an earlier run built -- frisket, the binary, the
      # VMs' closures -- and pushes what it builds. A pull request from a fork
      # has no token and only pulls.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: nix build .#checks.x86_64-linux.${{ matrix.check }}
        if: matrix.check != 'rest'
        run: nix build --print-build-logs --no-link '.#checks.x86_64-linux.${{ matrix.check }}'

      # Every check the other jobs do not build, and the other outputs `nix
      # flake check` would evaluate, built rather than only evaluated: one
      # evaluation, where `nix flake check --no-build` first would be two, and
      # the assertions check alone is a minute of it. chase-generate is among
      # them so the release below pulls it from the cache.
      - name: the other checks and outputs
        if: matrix.check == 'rest'
        run: |
          nix eval --json '.#checks.x86_64-linux' --apply 'cs: builtins.attrNames (removeAttrs cs [ "docker-session" "gcloud-session" "race" "test" ])' \
            | jq -r '.[] | ".#checks.x86_64-linux." + .' \
            | xargs nix build --print-build-logs --no-link \
                .#packages.x86_64-linux.chase-generate .#devShells.x86_64-linux.default .#formatter.x86_64-linux

  # CONTINUOUS RELEASE. Trunk-based: every push to trunk that passes the check
  # above is published, with no manual step and no tag to cut by hand. Gated on
  # a direct push to trunk (never a pull request) and on the check having
  # succeeded, so a red commit never ships.
  #
  # The derived version (major.commit-count.run-number, `chase-generate version`)
  # makes every build a unique, monotonic release, so two pushes cannot collide
  # on a tag and a re-run of the same commit does not either.
  release:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 because the minor is the commit count and
      # `chase-generate version` REFUSES a shallow clone; fetch-tags so the
      # previous tag resolves when the notes are generated below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # For chase-generate, which derives the version.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # chase-generate as `rest` built and pushed it.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Notes from the COMMITS since the last release. Trunk-based means direct
      # pushes and no pull requests, so GitHub's PR-based --generate-notes
      # would come out empty. On the first release there is no prior tag, so
      # fall back to the head commit rather than dumping the whole history.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(nix run .#chase-generate -- version)"
          PREV="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            git log "$PREV..HEAD" --pretty='- %s (%h)' > notes.md
          else
            { echo 'First automated release.'; echo; git log -1 --pretty='- %s (%h)'; } > notes.md
          fi
          gh release create "v$V" --title "v$V" --notes-file notes.md --target "$GITHUB_SHA"
