# A small Engine-API-shaped Swagger 2.0 spec, for the operations check: a
# basePath, an explicit HEAD beside a GET, a body through #/parameters, and
# every way a body's schema is walked or not.
swagger: "2.0"
basePath: "/v1.2"
info:
  title: "Demo"
  version: "1.2"
parameters:
  ThingId:
    name: id
    in: path
    required: true
    type: string
  ThingBody:
    name: body
    in: body
    required: true
    schema:
      allOf:
        - $ref: "#/definitions/ThingConfig"
        - type: object
          properties:
            Host:
              $ref: "#/definitions/HostConfig"
definitions:
  MountType:
    type: string
    enum: ["volume", "tmpfs"]
  Mount:
    type: object
    properties:
      Type:
        allOf:
          - $ref: "#/definitions/MountType"
      Source:
        type: string
  Health:
    type: object
    properties:
      Test:
        type: array
        items:
          type: string
  Resources:
    type: object
    properties:
      Memory:
        type: integer
  ThingConfig:
    type: object
    properties:
      Name:
        type: string
      Labels:
        type: object
        additionalProperties:
          type: object
          properties:
            Hidden:
              type: string
      Mounts:
        type: array
        items:
          $ref: "#/definitions/Mount"
      Kind:
        allOf:
          - $ref: "#/definitions/MountType"
      Health:
        $ref: "#/definitions/Health"
  HostConfig:
    allOf:
      - $ref: "#/definitions/Resources"
      - type: object
        properties:
          Binds:
            type: array
            items:
              type: string
paths:
  /_ping:
    get:
      summary: "Ping"
      operationId: "Ping"
      tags: ["System"]
    head:
      summary: "Ping, headers only"
      operationId: "PingHead"
      tags: ["System"]
  /version:
    get: &ver
      summary: "Version"
      description: "What the daemon is."
      operationId: "Version"
      tags: ["System"]
  /things/json:
    get:
      <<: *ver
      summary: on
      operationId: "ThingList"
      description: 0x1F
      tags: [on, 1:30, 0o7, 012, 1_000, .5, 1e5, 1.5e+20, 1.0e-7, ~, 'yes', 1.0, 190:20:30.15]
      x-map: {on: 1, 12: 2, 1.5: 3, ~: 4, "=": 5, true: 6, 0x10: 7}
      tags: ["Thing"]
  /things/create:
    post:
      summary: "Create a thing"
      operationId: "ThingCreate"
      tags: ["Thing"]
      parameters:
        - $ref: "#/parameters/ThingBody"
        - name: name
          in: query
          type: string
  /things/{id}/json:
    get:
      summary: "Inspect a thing"
      operationId: "ThingInspect"
      tags: ["Thing"]
      parameters:
        - $ref: "#/parameters/ThingId"
  /things/{id}:
    delete:
      summary: "Remove a thing"
      operationId: "ThingDelete"
      tags: ["Thing"]
      parameters:
        - $ref: "#/parameters/ThingId"
